<html lang="zh-Hant-TW">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231d7767'/%3E%3Cpath d='M17 36c10-1 18-8 22-19 10 8 10 23 0 32-8 7-19 5-25-1-3-3-2-9 3-12Z' fill='%23f9d477'/%3E%3Cpath d='M20 48c7-10 14-16 24-24' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink:#203c38; --ink-soft:#52716b; --muted:#78908a; --canvas:#f5f8f5; --paper:#fff; --paper-warm:#fffdf8; --mint:#e8f3ed; --mint-strong:#cfe9dc; --teal:#1d7767; --teal-dark:#12594d; --yellow:#f9d477; --yellow-soft:#fff4d2; --line:#e2ebe5; --shadow:0 18px 44px rgba(31,68,58,.08); --radius-lg:28px; }
    *{box-sizing:border-box} html{background:var(--canvas)} body{min-height:100vh;margin:0;color:var(--ink);background:radial-gradient(circle at 84% -12%,rgba(249,212,119,.28),transparent 28rem),linear-gradient(180deg,#f9fbf9 0,var(--canvas) 70%);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px} button,input{font:inherit} button{cursor:pointer}.app{width:min(100% - 32px,1020px);margin:0 auto;padding:26px 0 42px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.brand{display:inline-flex;align-items:center;gap:11px;min-width:0}.brand-mark{display:grid;width:42px;height:42px;flex:0 0 auto;place-items:center;border-radius:14px;color:#fff;background:var(--teal);box-shadow:0 8px 18px rgba(29,119,103,.2)}.brand-mark svg{width:25px;height:25px}.brand-copy{line-height:1.15}.brand-name{display:block;font-size:1rem;font-weight:900;letter-spacing:.04em}.brand-subtitle{display:block;margin-top:4px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.08em}.top-actions{display:flex;align-items:center;gap:10px}.date-chip{display:flex;align-items:center;gap:9px;padding:10px 13px;border:1px solid var(--line);border-radius:14px;color:var(--ink-soft);background:rgba(255,255,255,.75);font-size:.85rem;font-weight:800}.date-chip svg{width:16px;height:16px;color:var(--teal)}.icon-button{display:grid;width:42px;height:42px;place-items:center;padding:0;border:1px solid var(--line);border-radius:14px;color:var(--ink-soft);background:#fff;transition:border-color .18s ease,color .18s ease,transform .18s ease}.icon-button:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}.icon-button:focus-visible,.action-button:focus-visible,.save-button:focus-visible{outline:3px solid rgba(249,212,119,.9);outline-offset:3px}.icon-button svg{width:19px;height:19px}
    .page-intro{margin-bottom:24px}.overline{margin:0 0 9px;color:var(--teal);font-size:.77rem;font-weight:900;letter-spacing:.16em}.page-intro h1{max-width:11em;margin:0;font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.05;letter-spacing:-.07em}.page-intro h1 span{color:var(--teal)}.page-intro p{margin:14px 0 0;color:var(--ink-soft);font-size:1rem;font-weight:600}
    .dashboard{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.85fr);gap:20px;align-items:start}.card{border:1px solid rgba(255,255,255,.8);border-radius:var(--radius-lg);background:var(--paper);box-shadow:var(--shadow)}
    .today-card{position:relative;overflow:hidden;padding:29px;background:var(--paper-warm)}.today-card:after{position:absolute;right:-65px;bottom:-90px;width:220px;height:220px;border-radius:50%;background:var(--yellow-soft);content:""}.card-topline{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px}.section-label{margin:0;color:var(--muted);font-size:.78rem;font-weight:900;letter-spacing:.12em}.today-badge{padding:7px 10px;border-radius:999px;color:var(--teal-dark);background:var(--yellow-soft);font-size:.76rem;font-weight:900}
    .assignee-block{position:relative;z-index:1;display:flex;align-items:center;gap:17px;margin:27px 0 28px}.avatar{display:grid;width:76px;height:76px;flex:0 0 auto;place-items:center;border:6px solid #fff;border-radius:25px;color:var(--teal-dark);background:var(--yellow);box-shadow:0 9px 18px rgba(80,71,28,.12);font-size:2rem;font-weight:950}.assignee-title{margin:0 0 5px;color:var(--muted);font-size:.88rem;font-weight:800}.assignee-name{margin:0;font-size:clamp(2.1rem,7vw,3.45rem);line-height:1;font-weight:950;letter-spacing:-.08em}.assignee-date{margin:9px 0 0;color:var(--ink-soft);font-size:.9rem;font-weight:700}
    .action-button{position:relative;z-index:1;display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border:0;border-radius:18px;color:#fff;background:var(--teal);box-shadow:0 12px 24px rgba(29,119,103,.2);text-align:left;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}.action-button:hover{background:var(--teal-dark);box-shadow:0 15px 27px rgba(29,119,103,.26);transform:translateY(-2px)}.action-button:active{transform:translateY(1px)}.action-button:disabled{cursor:default}.action-button:disabled:hover{background:var(--teal);box-shadow:0 12px 24px rgba(29,119,103,.2);transform:none}.action-copy{display:grid;gap:3px}.action-main{font-size:1.22rem;font-weight:950;letter-spacing:.04em}.action-hint{color:rgba(255,255,255,.78);font-size:.79rem;font-weight:700}.action-icon{display:grid;width:42px;height:42px;flex:0 0 auto;place-items:center;border-radius:13px;color:var(--teal-dark);background:var(--yellow)}.action-icon svg{width:22px;height:22px}.completion-message{position:relative;z-index:1;min-height:24px;margin:12px 3px 0;color:var(--muted);font-size:.85rem;font-weight:700}.completion-message strong{color:var(--teal)}
    .side-column{display:grid;gap:20px}.stats-card{padding:23px}.stats-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.stats-heading h2,.history-heading h2{margin:0;font-size:1.06rem;letter-spacing:-.02em}.stats-heading p{margin:5px 0 0;color:var(--muted);font-size:.78rem;font-weight:700}.score{display:flex;align-items:baseline;gap:2px;color:var(--teal)}.score strong{font-size:2rem;line-height:1;letter-spacing:-.08em}.score span{color:var(--muted);font-size:.8rem;font-weight:800}.progress-track{height:10px;margin:20px 0 18px;overflow:hidden;border-radius:99px;background:var(--mint)}.progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),#5cad85);transition:width .45s ease}.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat-item{padding:13px;border-radius:15px;background:var(--canvas)}.stat-item strong{display:block;font-size:1.15rem}.stat-item span{display:block;margin-top:4px;color:var(--muted);font-size:.75rem;font-weight:700}
    .history-card{padding:23px}.history-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.history-heading span{color:var(--muted);font-size:.76rem;font-weight:800}.history-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}.history-item{display:grid;grid-template-columns:43px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border-radius:14px}.history-item.current{background:var(--mint)}.history-day{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;color:var(--ink-soft);background:var(--canvas);font-size:.76rem;font-weight:900}.history-item.current .history-day{color:var(--teal-dark);background:#fff}.history-person{min-width:0}.history-person strong,.history-person span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-person strong{font-size:.84rem}.history-person span{margin-top:2px;color:var(--muted);font-size:.72rem;font-weight:700}.history-status{padding:5px 8px;border-radius:999px;color:var(--muted);background:var(--canvas);font-size:.68rem;font-weight:900;white-space:nowrap}.history-status.done{color:var(--teal-dark);background:var(--mint-strong)}
    .footer{display:flex;justify-content:space-between;gap:12px;margin-top:21px;color:var(--muted);font-size:.75rem;font-weight:700}.footer span{display:inline-flex;align-items:center;gap:6px}.footer svg{width:14px;height:14px;color:var(--teal)}dialog{width:min(calc(100% - 32px),430px);padding:0;border:0;border-radius:24px;color:var(--ink);box-shadow:0 28px 70px rgba(25,57,50,.25)}dialog::backdrop{background:rgba(23,50,44,.36);backdrop-filter:blur(4px)}.dialog-body{padding:26px}.dialog-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.dialog-top h2{margin:0;font-size:1.4rem;letter-spacing:-.04em}.dialog-top p{margin:7px 0 0;color:var(--muted);font-size:.82rem;font-weight:700}.dialog-close{width:34px;height:34px}.form-fields{display:grid;gap:15px;margin-top:24px}.field{display:grid;gap:7px}.field label{color:var(--ink-soft);font-size:.82rem;font-weight:900}.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;outline:0;color:var(--ink);background:var(--canvas);font-weight:800}.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(29,119,103,.12)}.save-button{width:100%;margin-top:23px;padding:13px;border:0;border-radius:13px;color:#fff;background:var(--teal);font-weight:900}.confetti{position:fixed;z-index:20;top:-12px;width:8px;height:13px;border-radius:2px;pointer-events:none;animation:fall 900ms ease-out forwards}@keyframes fall{to{transform:translate3d(var(--x),100vh,0) rotate(540deg);opacity:0}}
    @media(max-width:760px){.app{width:min(100% - 24px,640px);padding-top:16px}.topbar{margin-bottom:25px}.date-chip{padding:9px 10px}.date-chip span{display:none}.dashboard{grid-template-columns:1fr}.side-column{grid-template-columns:1fr 1fr;align-items:start}}
    @media(max-width:520px){.topbar{align-items:flex-start}.brand-mark{width:38px;height:38px;border-radius:13px}.brand-subtitle{display:none}.page-intro{margin-bottom:19px}.page-intro h1{font-size:2.45rem}.today-card,.stats-card,.history-card{padding:20px;border-radius:23px}.assignee-block{margin:23px 0}.avatar{width:64px;height:64px;border-radius:21px;font-size:1.7rem}.assignee-name{font-size:2.35rem}.side-column{grid-template-columns:1fr}.footer{flex-direction:column;align-items:center}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 13.4c3.9-.4 7.1-3 8.6-7.4 4.1 3.2 4.1 9.2 0 12.2-3.2 2.4-7.3 1.6-9.1-.2-1.2-1.2-1.1-3.4.5-4.6Z" fill="currentColor"/><path d="M7.2 19c2.2-3.2 4.4-5.4 7.6-7.7" stroke="#f9d477" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="brand-copy"><span class="brand-name">拾光桌面</span><span class="brand-subtitle">FAMILY ROUTINE</span></span></div><div class="top-actions"><div class="date-chip" aria-label="今天日期"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span id="dateChipText"></span></div><button class="icon-button" id="settingsButton" type="button" aria-label="開啟輪值設定" title="輪值設定"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 15.1a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2Z" stroke="currentColor" stroke-width="1.8"/><path d="m19.1 13.1 1.1.9-1.7 2.9-1.4-.5a7.6 7.6 0 0 1-1.7 1l-.2 1.5h-3.4l-.2-1.5a7.6 7.6 0 0 1-1.7-1l-1.4.5-1.7-2.9 1.1-.9a7.4 7.4 0 0 1 0-2.1l-1.1-.9 1.7-2.9 1.4.5a7.6 7.6 0 0 1 1.7-1l.2-1.5h3.4l.2 1.5a7.6 7.6 0 0 1 1.7 1l1.4-.5 1.7 2.9-1.1.9a7.4 7.4 0 0 1 0 2.1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button></div></header>
    <section class="page-intro" aria-labelledby="pageTitle"><p class="overline">TODAY'S ROUTINE</p><h1 id="pageTitle">今天，<span id="introName">—</span> 整理桌面</h1><p id="dateLine">把每天的小事，變成看得見的成就。</p></section>
    <section class="dashboard" aria-label="輪值打卡總覽"><article class="card today-card"><div class="card-topline"><p class="section-label">今日輪值</p><span class="today-badge" id="todayBadge">待完成</span></div><div class="assignee-block"><div class="avatar" id="avatar" aria-hidden="true">—</div><div><p class="assignee-title">今天輪到</p><h2 class="assignee-name" id="assigneeName">—</h2><p class="assignee-date" id="fullDate">—</p></div></div><button class="action-button" id="checkinButton" type="button"><span class="action-copy"><span class="action-main" id="actionMain">完成打卡</span><span class="action-hint" id="actionHint">整理完成後，記下今天的好習慣</span></span><span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m6.5 12.5 3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button><p class="completion-message" id="completionMessage" aria-live="polite">完成後，這裡會顯示打卡時間。</p></article><div class="side-column"><article class="card stats-card"><div class="stats-heading"><div><h2>本週進度</h2><p>最近 7 天的整理紀錄</p></div><div class="score"><strong id="completionRate">0%</strong><span>完成</span></div></div><div class="progress-track" role="progressbar" aria-label="本週完成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><div class="stat-row"><div class="stat-item"><strong id="completedCount">0 / 7</strong><span>已完成天數</span></div><div class="stat-item"><strong id="streakCount">0 天</strong><span>目前連續完成</span></div></div></article><article class="card history-card"><div class="history-heading"><h2>近 7 日</h2><span>保持節奏</span></div><ul class="history-list" id="historyList" aria-label="近七日打卡紀錄"></ul></article></div></section>
    <footer class="footer"><span><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" stroke="currentColor" stroke-width="1.8"/><path d="m8.5 12 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>資料只保存在這台裝置</span><span>兩人每日交替輪值</span></footer>
  </main>
  <dialog id="settingsDialog" aria-labelledby="settingsTitle"><form class="dialog-body" id="settingsForm" method="dialog"><div class="dialog-top"><div><h2 id="settingsTitle">輪值設定</h2><p>修改後，今天的輪值會立即更新。</p></div><button class="icon-button dialog-close" id="closeSettings" type="button" aria-label="關閉設定">×</button></div><div class="form-fields"><div class="field"><label for="personOne">第一位輪值者</label><input id="personOne" maxlength="12" autocomplete="off" required></div><div class="field"><label for="personTwo">第二位輪值者</label><input id="personTwo" maxlength="12" autocomplete="off" required></div></div><button class="save-button" type="submit">儲存設定</button></form></dialog>
  <script>
    (() => {
      const KEYS={people:"family-desk-people",records:"family-desk-records",legacy:"family-desk-checkin"};const DEFAULT_PEOPLE=["大寶","二寶"];const ROTATION_START=new Date(2024,0,1);const $=(selector)=>document.querySelector(selector);const today=new Date();const dateKey=formatDateKey(today);const weekStart=getMonday(today);let people=loadPeople();let records=loadRecords();const currentPerson=getAssignee(today);$("#dateChipText").textContent=`${today.getMonth()+1} 月 ${today.getDate()} 日`;$("#introName").textContent=currentPerson;$("#assigneeName").textContent=currentPerson;$("#avatar").textContent=currentPerson.slice(0,1);$("#fullDate").textContent=new Intl.DateTimeFormat("zh-TW",{year:"numeric",month:"long",day:"numeric",weekday:"long"}).format(today);$("#dateLine").textContent=`今天是 ${new Intl.DateTimeFormat("zh-TW",{weekday:"long"}).format(today)}，整理好就完成今天的小任務。`;render();$("#checkinButton").addEventListener("click",completeToday);$("#settingsButton").addEventListener("click",openSettings);$("#closeSettings").addEventListener("click",()=>$("#settingsDialog").close());$("#settingsForm").addEventListener("submit",saveSettings);scheduleMidnightRefresh();
      function render(){const record=records[dateKey]||null;const completed=Boolean(record);$("#todayBadge").textContent=completed?"已完成":"待完成";$("#todayBadge").style.background=completed?"var(--mint-strong)":"var(--yellow-soft)";$("#actionMain").textContent=completed?"今天已完成打卡":"完成打卡";$("#actionHint").textContent=completed?`完成時間 ${record.time}`:"整理完成後，記下今天的好習慣";$("#checkinButton").disabled=completed;$("#completionMessage").innerHTML=completed?`太棒了，今天在 <strong>${escapeHtml(record.time)}</strong> 完成整理。`:"完成後，這裡會顯示打卡時間。";const stats=getWeekStats();$("#progressFill").style.width=`${stats.rate}%`;$("#completionRate").textContent=`${stats.rate}%`;$("#completedCount").textContent=`${stats.done} / 7`;$("#streakCount").textContent=`${getStreak()} 天`;$(".progress-track").setAttribute("aria-valuenow",String(stats.rate));renderHistory()}
      function completeToday(){if(records[dateKey])return;records[dateKey]={name:currentPerson,time:formatTime(new Date())};saveRecords();render();burstConfetti()}
      function renderHistory(){const items=[];for(let offset=0;offset<7;offset+=1){const day=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+offset);const key=formatDateKey(day);const record=records[key];const isToday=key===dateKey;const future=startOfDay(day)>startOfDay(today);const assigned=record?.name||getAssignee(day);const weekday=new Intl.DateTimeFormat("zh-TW",{weekday:"short"}).format(day).replace("週","");const status=record?"已完成":future?"未開始":"待打卡";const detail=isToday?"今天":future?`星期${escapeHtml(weekday)} · 尚未到`:`星期${escapeHtml(weekday)}`;items.push(`<li class="history-item${isToday?" current":""}"><span class="history-day">${isToday?"今":`${day.getMonth()+1}/${day.getDate()}`}</span><span class="history-person"><strong>${escapeHtml(assigned)}</strong><span>${detail}${record?.time?` · ${escapeHtml(record.time)}`:""}</span></span><span class="history-status${record?" done":""}">${status}</span></li>`)}$("#historyList").innerHTML=items.join("")}
      function openSettings(){$("#personOne").value=people[0];$("#personTwo").value=people[1];$("#settingsDialog").showModal()}
      function saveSettings(event){event.preventDefault();const first=$("#personOne").value.trim();const second=$("#personTwo").value.trim();if(!first||!second||first===second)return;people=[first,second];localStorage.setItem(KEYS.people,JSON.stringify(people));$("#settingsDialog").close();window.location.reload()}
      function loadPeople(){try{const saved=JSON.parse(localStorage.getItem(KEYS.people)||"null");return Array.isArray(saved)&&saved.length===2&&saved.every((name)=>typeof name==="string"&&name.trim())?saved:DEFAULT_PEOPLE}catch{return DEFAULT_PEOPLE}}
      function loadRecords(){try{const saved=JSON.parse(localStorage.getItem(KEYS.records)||"null");if(saved&&typeof saved==="object"&&!Array.isArray(saved))return saved;const old=JSON.parse(localStorage.getItem(KEYS.legacy)||"null");if(old?.date&&old?.time){const migrated={[old.date]:{name:getAssignee(new Date(`${old.date}T00:00:00`)),time:old.time}};localStorage.setItem(KEYS.records,JSON.stringify(migrated));return migrated}}catch{/* 使用空紀錄繼續工作 */}return {}}
      function saveRecords(){localStorage.setItem(KEYS.records,JSON.stringify(records))}function getAssignee(day){return people[daysBetween(ROTATION_START,startOfDay(day))%people.length]}function getWeekStats(){let done=0;for(let i=0;i<7;i+=1){const day=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+i);if(records[formatDateKey(day)])done+=1}return{done,rate:Math.round(done/7*100)}}function getStreak(){let streak=0;for(let i=0;i<7;i+=1){const day=new Date(today.getFullYear(),today.getMonth(),today.getDate()-i);if(!records[formatDateKey(day)])break;streak+=1}return streak}function getMonday(date){const day=date.getDay();const diff=day===0?-6:1-day;return new Date(date.getFullYear(),date.getMonth(),date.getDate()+diff)}function formatDateKey(date){return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`}function formatTime(date){return new Intl.DateTimeFormat("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false}).format(date)}function startOfDay(date){return new Date(date.getFullYear(),date.getMonth(),date.getDate())}function daysBetween(from,to){return Math.floor((to-startOfDay(from))/86400000)}function escapeHtml(value){return String(value).replace(/[&<>'"]/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]))}function scheduleMidnightRefresh(){const next=new Date(today.getFullYear(),today.getMonth(),today.getDate()+1,0,0,1);window.setTimeout(()=>window.location.reload(),next-new Date())}function burstConfetti(){const colors=["#1d7767","#f9d477","#e58b6c","#77b99a"];for(let i=0;i<22;i+=1){const piece=document.createElement("i");piece.className="confetti";piece.style.left=`${25+Math.random()*50}%`;piece.style.background=colors[i%colors.length];piece.style.setProperty("--x",`${(Math.random()-.5)*260}px`);piece.style.animationDelay=`${Math.random()*120}ms`;document.body.appendChild(piece);window.setTimeout(()=>piece.remove(),1100)}}
    })();
